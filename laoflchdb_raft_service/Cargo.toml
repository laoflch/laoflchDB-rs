[package]
name = "laoflchdb_raft_service"
version = "0.1.0"
edition = "2021"

[dependencies]
openraft = { version = "0.9", features = ["serde", "storage-v2", "generic-snapshot-data"] }
tonic = { version = "0.11", features = ["transport"] }
prost = "0.12"
prost-types = "0.12"
tokio = { version = "1.0", features = ["full"] }
log = "0.4"
env_logger = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bytes = "1.0"
futures = "0.3"
thiserror = "1.0"
bincode = "1.3"
hex = "0.4"
rocksdb = { version = "0.50", package = "rust-rocksdb", features = ["zstd-static-linking-only"] }

[build-dependencies]
tonic-build = "0.11"
