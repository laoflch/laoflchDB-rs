syntax = "proto3";

package laoflchdb.face_service;

// 人脸服务 - 基于 SCRFD 人脸检测 + 5 关键点仿射对齐 + ArcFace 特征提取
// 支持从图片中检测人脸、对齐裁剪 112x112、提取 512 维 L2 归一化特征
// 可选通过 image_service 保存对齐后的人脸图片
service FaceService {
  // 检测人脸：从图片中检测所有人脸，返回人脸框和 5 个关键点
  rpc DetectFaces(DetectFacesRequest) returns (DetectFacesResponse);

  // 提取人脸特征：检测人脸 → 对齐裁剪 112x112 → ArcFace 提取 512 维特征 → L2 归一化
  // 可选保存对齐后的人脸图片到 image_service
  rpc ExtractFaceFeatures(ExtractFaceFeaturesRequest) returns (ExtractFaceFeaturesResponse);

  // 对已对齐的 112x112 人脸图片直接提取特征（跳过检测和对齐）
  rpc ExtractFeatureFromAligned(ExtractFeatureFromAlignedRequest) returns (ExtractFeatureFromAlignedResponse);

  // 比较两个人脸特征向量的相似度（余弦相似度）
  rpc CompareFeatures(CompareFeaturesRequest) returns (CompareFeaturesResponse);

  // 保存原图到 image_service（内部调用 ImageService，避免客户端二次上传）
  // 原图会自动向量化索引到 image 索引，遇重复自动跳过返回已有 key
  rpc SaveOriginalImage(SaveOriginalImageRequest) returns (SaveOriginalImageResponse);

  // 已保存人脸自动分类（HDBSCAN 聚类，内部复用 image_service 的分类流程，结果仅返回不写入索引）
  rpc ClassifyFaces(ClassifyFacesRequest) returns (ClassifyFacesResponse);

  // 新增人脸分类：将指定人脸组的向量计算 medoid 并保存（供后续归属分类召回）
  rpc CreateFaceClass(CreateFaceClassRequest) returns (CreateFaceClassResponse);
  // 删除人脸分类：删除全文索引中的分类文档、人脸归属文档及 face_class 索引中的 medoid 向量
  rpc DeleteFaceClass(DeleteFaceClassRequest) returns (DeleteFaceClassResponse);

  // 列出已保存的人脸分类：从全文索引 face_class 读取分类列表
  rpc ListFaceClasses(ListFaceClassesRequest) returns (ListFaceClassesResponse);

  // 将当前人脸保存到指定人脸分类：把人脸 key 加入分类，重算 medoid 并更新索引
  rpc SaveFaceToClass(SaveFaceToClassRequest) returns (SaveFaceToClassResponse);

  // 从指定人脸分类中移除人脸：把人脸 key 从分类中移除，重算 medoid 并更新索引
  rpc RemoveFaceFromClass(RemoveFaceFromClassRequest) returns (RemoveFaceFromClassResponse);
}

// ── DetectFaces ────────────────────────────

message DetectFacesRequest {
  // 图片二进制数据（支持 JPEG/PNG 等常见格式）
  bytes image_data = 1;
  // 检测阈值（0~1，默认 0.5，越高越严格）
  float det_threshold = 2;
  // 最大检测人脸数量（0=不限，默认 0）
  int32 max_faces = 3;
  // 图片 key（从 image_service 获取图片数据，替代 image_data 字段）
  string image_key = 4;
  // 图片 key 所在的 bucket（留空用 "images"）
  string bucket = 5;
}

// 人脸检测结果
message DetectedFace {
  // 人脸边界框 [x1, y1, x2, y2]（原图像素坐标）
  repeated float bbox = 1;
  // 置信度（0~1）
  float score = 2;
  // 5 个关键点 [x, y] 共 10 个值，顺序：左眼、右眼、鼻尖、左嘴角、右嘴角
  repeated float landmarks = 3;
}

message DetectFacesResponse {
  bool success = 1;
  string message = 2;
  repeated DetectedFace faces = 3;
  // 原图宽度
  int32 image_width = 4;
  // 原图高度
  int32 image_height = 5;
}

// ── ExtractFaceFeatures ────────────────────────────

message ExtractFaceFeaturesRequest {
  // 图片二进制数据
  bytes image_data = 1;
  // 检测阈值（0~1，默认 0.5）
  float det_threshold = 2;
  // 最大检测人脸数量（0=不限，默认 0 表示检测所有）
  int32 max_faces = 3;
  // 是否保存对齐后的人脸图片到 image_service
  bool save_aligned_images = 4;
  // 保存人脸图片使用的 bucket（仅当 save_aligned_images=true 时有效，留空则用 image_service 默认 bucket）
  string image_bucket = 5;
  // 是否返回对齐后的人脸图片数据（默认 false 以节省带宽）
  bool return_aligned_images = 6;
  // 是否把人脸特征向量写入 embedding_service 的 HNSW 索引（index_name 固定为 "face"）
  // 需要配合 save_aligned_images=true 使用，向量 ID 复用图片 Snowflake ID
  bool index_embedding = 7;
  // 是否自动保存原图到 image_service，原图 key 会作为人脸 name 元数据保存
  bool save_original_image = 8;
  // 原图在本地的文件名/路径，保存为 image_service 中图片的 name 元数据
  string original_image_name = 9;
  // 图片 key（从 image_service 获取图片数据，替代 image_data 字段）
  string image_key = 10;
  // 图片 key 所在的 bucket（留空用 "images"）
  string bucket = 11;
}

// 人脸特征提取结果
message FaceFeature {
  // 对应的人脸检测结果
  DetectedFace detection = 1;
  // 512 维 L2 归一化特征向量
  repeated float embedding = 2;
  // 对齐后的 112x112 人脸图片（仅当 return_aligned_images=true 时填充）
  bytes aligned_image = 3;
  // 对齐图片在 image_service 中的 key（仅当 save_aligned_images=true 时填充）
  string saved_image_key = 4;
  // 对齐图片所在 bucket（仅当 save_aligned_images=true 时填充）
  string saved_image_bucket = 5;
  // 写入 embedding_service 的向量 ID（仅当 index_embedding=true 且索引成功时填充，0 表示未索引）
  uint64 indexed_vector_id = 6;
  // 原图在 image_service 中的 key（仅当 save_original_image=true 时填充）
  string saved_original_image_key = 7;
}

message ExtractFaceFeaturesResponse {
  bool success = 1;
  string message = 2;
  repeated FaceFeature faces = 3;
  int32 image_width = 4;
  int32 image_height = 5;
}

// ── ExtractFeatureFromAligned ────────────────────────────

message ExtractFeatureFromAlignedRequest {
  // 已对齐的 112x112 人脸图片二进制数据
  bytes aligned_image_data = 1;
}

message ExtractFeatureFromAlignedResponse {
  bool success = 1;
  string message = 2;
  // 512 维 L2 归一化特征向量
  repeated float embedding = 3;
}

// ── CompareFeatures ────────────────────────────

message CompareFeaturesRequest {
  // 第一个人脸特征向量（512 维）
  repeated float feature1 = 1;
  // 第二个人脸特征向量（512 维）
  repeated float feature2 = 2;
}

message CompareFeaturesResponse {
  bool success = 1;
  string message = 2;
  // 余弦相似度（-1~1，1 表示完全相同）
  float similarity = 3;
  // 是否同一人（similarity >= 0.5 视为同一人）
  bool is_same_person = 4;
}

// ── SaveOriginalImage ────────────────────────────

message SaveOriginalImageRequest {
  // 原始图片二进制数据
  bytes image_data = 1;
  // 保存到 image_service 的 bucket（留空用默认 bucket）
  string bucket = 2;
}

message SaveOriginalImageResponse {
  bool success = 1;
  string message = 2;
  // 保存后的图片 key（Snowflake ID）
  string key = 3;
}

// ── ClassifyFaces ────────────────────────────

message ClassifyFacesRequest {
  // 人脸图片所在 bucket（留空用 "faces"）
  string bucket = 1;
  // 最少聚类点数（默认 3，低于此数量的簇归为噪声）
  int32 min_cluster_size = 2;
  // 敏感度：密度估计近邻数 min_samples（默认 5，越大聚类越保守）
  int32 min_samples = 3;
}

// 人脸分类组
message FaceClassGroup {
  // 分类名称（如 "分类 1"）
  string name = 1;
  // 分类标签（如 "cat_0"）
  string category = 2;
  // 该分类下的人脸图片 key 列表
  repeated string keys = 3;
}

message ClassifyFacesResponse {
  bool success = 1;
  string message = 2;
  // 分类结果（按人脸数降序，不含噪声）
  repeated FaceClassGroup groups = 3;
  // 参与聚类的人脸数
  int32 total = 4;
  // 未分类（噪声）人脸数
  int32 noise_count = 5;
}

// ── CreateFaceClass ────────────────────────────

message CreateFaceClassRequest {
  // 分类名称（用户自定义，如"张三"）
  string name = 1;
  // 该分类下的人脸图片 key 列表（用于计算 medoid）
  repeated string keys = 2;
  // 人脸图片所在 bucket（默认 faces）
  string bucket = 3;
}

message CreateFaceClassResponse {
  bool success = 1;
  string message = 2;
  // 分类 ID（Snowflake）
  int64 class_id = 3;
  // 保存的 medoid 向量维度
  int32 medoid_dim = 4;
  // 参与计算的向量数
  int32 vector_count = 5;
}

// ── DeleteFaceClass ────────────────────────────

message DeleteFaceClassRequest {
  // 分类 ID（Snowflake）
  int64 class_id = 1;
  // 人脸图片所在 bucket（默认 faces）
  string bucket = 2;
}

message DeleteFaceClassResponse {
  bool success = 1;
  string message = 2;
}

// ── ListFaceClasses ────────────────────────────

message ListFaceClassesRequest {
  // 人脸图片所在 bucket（默认 faces，兼容保留）
  string bucket = 1;
}

// 已保存的人脸分类条目
message FaceClassItem {
  // 分类 ID（Snowflake）
  int64 class_id = 1;
  // 分类名称
  string name = 2;
  // 该分类下的人脸图片 key 列表
  repeated string keys = 3;
  // 创建时间戳（秒）
  int64 created_at = 4;
  // Medoid 对应的人脸图片 key（作为分类的展示图片）
  string medoid_key = 5;
}

message ListFaceClassesResponse {
  bool success = 1;
  string message = 2;
  // 分类列表（按分类 ID 降序）
  repeated FaceClassItem classes = 3;
}

// ── SaveFaceToClass ────────────────────────────

message SaveFaceToClassRequest {
  // 目标分类 ID（Snowflake）
  int64 class_id = 1;
  // 当前人脸 key（即 face 索引中的向量 ID）
  int64 face_id = 2;
}

message SaveFaceToClassResponse {
  bool success = 1;
  string message = 2;
  // 更新后的分类 ID
  int64 class_id = 3;
  // 更新后 Medoid 对应的人脸图片 key
  string medoid_key = 4;
}

// ── RemoveFaceFromClass ────────────────────────────

message RemoveFaceFromClassRequest {
  // 目标分类 ID（Snowflake）
  int64 class_id = 1;
  // 待移除的人脸 key（即 face 索引中的向量 ID）
  int64 face_id = 2;
}

message RemoveFaceFromClassResponse {
  bool success = 1;
  string message = 2;
  // 更新后的分类 ID
  int64 class_id = 3;
  // 更新后 Medoid 对应的人脸图片 key
  string medoid_key = 4;
}
