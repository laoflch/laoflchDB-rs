[package]
name = "lsql"
version = "0.1.10+cc2d24a74cd6ba6c63ca018c78c5439b20462408"
edition = "2021"
description = "LaoflchDB 交互式 SQL 客户端 (类似 PostgreSQL 的 psql)"

[[bin]]
name = "lsql"
path = "main.rs"

[dependencies]
laoflchdb_client = { path = "../laoflchdb_client" }
clap = { version = "4.5", features = ["derive"] }
tonic = "0.11"
rustyline = "12.0"
tokio = { version = "1.0", features = ["full"] }
lazy_static = "1.4"