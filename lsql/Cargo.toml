[package]
name = "lsql"
version = "0.1.10+9e0b54eabb3ca84fdf3a02056208cb4dbff9183a"
edition = "2021"
description = "LaoflchDB 交互式 SQL 客户端 (类似 PostgreSQL 的 psql)"

[[bin]]
name = "lsql"
path = "main.rs"

[dependencies]
laoflchdb_client = { path = "../laoflchdb_client" }
clap = { version = "4.5", features = ["derive"] }
tonic = "0.11"
rustyline = "12.0"
tokio = { version = "1.0", features = ["full"] }
lazy_static = "1.4"