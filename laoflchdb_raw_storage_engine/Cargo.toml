[package]
name = "laoflchdb_raw_storage_engine"
version = "0.1.0"
edition = "2021"
description = "laoflchdb raw storage engine：将分块后的数据块直接写入文件系统"

[dependencies]
async-trait = "0.1"
tokio = { version = "1.0", features = ["fs", "io-util", "rt", "macros"] }
sha2 = "0.10"
hex = "0.4"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
uuid = { version = "1.0", features = ["v4"] }

[dev-dependencies]
tempfile = "3.0"
