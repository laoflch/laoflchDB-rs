[package]
name = "laoflchdb_text_summarize_service"
version = "0.1.0"
edition = "2021"

[dependencies]
# Proto 定义（独立 crate，避免客户端拉入 candle 等重型依赖）
laoflchdb_text_summarize_service_proto = { path = "../laoflchdb_text_summarize_service_proto" }
# gRPC
tonic = "0.11"
prost = "0.12"
tokio = { version = "1.0", features = ["full"] }
# 推理框架
candle-core = "=0.10.2"
candle-nn = "=0.10.2"
candle-transformers = "=0.10.2"
tokenizers = "0.22"
# 序列化与日志
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
anyhow = "1.0"
regex = "1.10"

[build-dependencies]
tonic-build = "0.11"

[features]
cuda = ["candle-core/cuda", "candle-nn/cuda", "candle-transformers/cuda"]
